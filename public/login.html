<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login or Register - SkillSwap</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <div class="nav-container">
      <h1><a href="./index.html">SkillSwap</a></h1>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="/index.html">Browse Skills</a></li>
          <li id="nav-login-link"><a href="/login.html">Login / Register</a></li>
          <li id="nav-dash-link" hidden><a href="/dashboard.html">My Dashboard</a></li>
          <li id="nav-logout-link" hidden><a href="#" id="logout-btn">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div id="auth-alert" class="alert-success" role="status" hidden></div>

    <!-- Section 1: Login -->
    <section aria-labelledby="login-heading">
      <h2 id="login-heading">Student Login</h2>
      <div id="login-error" class="alert-error" role="alert" hidden></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address <span class="error-text">(required)</span></label>
          <input type="email" id="login-email" name="email" required autocomplete="email">
          <p id="login-email-err" class="error-text" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="login-password">Password <span class="error-text">(required)</span></label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
          <p id="login-password-err" class="error-text" role="alert"></p>
        </div>

        <button type="submit">Log In</button>
      </form>
    </section>

    <!-- Section 2: Register -->
    <section aria-labelledby="register-heading">
      <h2 id="register-heading">New Student Registration</h2>
      <div id="register-error" class="alert-error" role="alert" hidden></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name <span class="error-text">(required)</span></label>
          <input type="text" id="reg-name" name="name" required autocomplete="name">
          <p id="reg-name-err" class="error-text" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="reg-email">University Email <span class="error-text">(required)</span></label>
          <input type="email" id="reg-email" name="email" required autocomplete="email">
          <p id="reg-email-err" class="error-text" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="reg-password">Password (at least 6 characters) <span class="error-text">(required)</span></label>
          <input type="password" id="reg-password" name="password" required autocomplete="new-password">
          <p id="reg-password-err" class="error-text" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="reg-dept">Department</label>
          <input type="text" id="reg-dept" name="department" placeholder="e.g. Computer Science">
        </div>

        <div class="form-group">
          <label for="reg-bio">Short Bio</label>
          <textarea id="reg-bio" name="bio" rows="3" placeholder="Tell other students what subjects you enjoy or want to learn"></textarea>
        </div>

        <button type="submit">Register Account</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 SkillSwap. A peer learning platform.</p>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
